name: pegboard_bounce
description: "Pegboard Bounce - a colorful memory matching game."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # WebView + local browsing surface.
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.12.0

  # Persistence.
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.0

  # Networking + connectivity sensing.
  http: ^1.5.0
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.1

  # Attribution / config / messaging stack.
  appsflyer_sdk: ^6.17.2
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_app_check: ^0.4.4
  flutter_local_notifications: ^22.0.0

  # Real device metadata for the outbound User-Agent.
  device_info_plus: ^11.4.0
  clarity_flutter: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: false
  image_path: "assets/Pegboard_Bounce_additional_assets/icon2.png"
  adaptive_icon_background: "#231043"
  adaptive_icon_foreground: "assets/Pegboard_Bounce_additional_assets/icon2.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/Pegboard_Bounce_additional_assets/
    - assets/Pegboard_Bounce_gameplay_assets/
